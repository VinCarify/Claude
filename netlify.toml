# Fallback für Netlify ohne "Base directory": zeigt auf den Unterordner km-tracker/.
# Ist Base directory = km-tracker gesetzt, gilt stattdessen km-tracker/netlify.toml.
# CARIFY KM-Tracking – static site + one Netlify Function (no build step, no dependencies)

[build]
  publish = "km-tracker/public"
  functions = "km-tracker/netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"
